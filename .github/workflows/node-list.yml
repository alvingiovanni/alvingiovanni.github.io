
# Keeps the generated parts of the site in step with the content.
#
# The site can't discover files by itself (GitHub Pages serves files but can't
# list a folder), so tools/build-node-list.py regenerates content/nodes.json.
# The same script validates content/semantic.json, builds the full case-study
# pages under projects/, refreshes the static summary in index.html, writes the
# agent's corpus, and updates the sitemap — then commits whatever changed. Adding
# a circle is still just adding a .md file, including from the github.com editor.

name: Build content

on:
  push:
    paths:
      - "content/**"
      - "tools/build-node-list.py"
      - ".github/workflows/node-list.yml"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  # If several commits land quickly, only the newest run matters.
  group: node-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build generated content (fails on semantic-layer drift)
        run: python3 tools/build-node-list.py

      - name: Commit if anything changed
        run: |
          git add content/nodes.json content/corpus.md projects index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated content already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated content [skip ci]"
          git push
