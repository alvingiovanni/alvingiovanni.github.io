<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @font-face { font-family: 'Space Grotesk'; }
      .name { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 72px; font-weight: 700; letter-spacing: -2px; fill: #1d1d1f; }
      .role { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 32px; font-weight: 500; letter-spacing: -0.5px; fill: #3867d6; }
      .url  { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 24px; font-weight: 400; fill: #929298; letter-spacing: 0; }
    </style>
    <!-- Gradient for decorative circles -->
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3867d6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3867d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7655c5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7655c5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f7f5"/>

  <!-- Decorative graph in the right half -->
  <!-- Glow halos -->
  <circle cx="900" cy="315" r="220" fill="url(#glow-blue)"/>
  <circle cx="900" cy="315" r="140" fill="url(#glow-purple)"/>

  <!-- Radial rings (faint) -->
  <circle cx="900" cy="315" r="80"  fill="none" stroke="#606068" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="900" cy="315" r="155" fill="none" stroke="#606068" stroke-opacity="0.09" stroke-width="1"/>
  <circle cx="900" cy="315" r="230" fill="none" stroke="#606068" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Edges (spokes from center to branch nodes) -->
  <line x1="900" y1="315" x2="900" y2="160" stroke="#3867d6" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="900" y1="315" x2="1040" y2="228" stroke="#7655c5" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="900" y1="315" x2="1040" y2="402" stroke="#27866e" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="900" y1="315" x2="900" y2="470" stroke="#bd7623" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="900" y1="315" x2="760" y2="402" stroke="#c65370" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Edges from branch to leaf nodes (blue branch: Work) -->
  <line x1="900" y1="160" x2="840" y2="68"  stroke="#3867d6" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="900" y1="160" x2="960" y2="68"  stroke="#3867d6" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Edges from branch to leaf nodes (purple branch: Skills) -->
  <line x1="1040" y1="228" x2="1102" y2="150" stroke="#7655c5" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="1040" y1="228" x2="1120" y2="228" stroke="#7655c5" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Leaf nodes -->
  <circle cx="840" cy="68"  r="7" fill="#3867d6" fill-opacity="0.5"/>
  <circle cx="960" cy="68"  r="7" fill="#3867d6" fill-opacity="0.5"/>
  <circle cx="1102" cy="150" r="7" fill="#7655c5" fill-opacity="0.5"/>
  <circle cx="1120" cy="228" r="7" fill="#7655c5" fill-opacity="0.5"/>
  <circle cx="1060" cy="450" r="7" fill="#27866e" fill-opacity="0.5"/>
  <circle cx="940" cy="528" r="7" fill="#bd7623" fill-opacity="0.5"/>
  <circle cx="760" cy="490" r="7" fill="#c65370" fill-opacity="0.5"/>

  <!-- Branch nodes (depth 1) -->
  <circle cx="900" cy="160" r="22" fill="#fff" stroke="#3867d6" stroke-width="2"/>
  <circle cx="1040" cy="228" r="22" fill="#fff" stroke="#7655c5" stroke-width="2"/>
  <circle cx="1040" cy="402" r="22" fill="#fff" stroke="#27866e" stroke-width="2"/>
  <circle cx="900" cy="470" r="22" fill="#fff" stroke="#bd7623" stroke-width="2"/>
  <circle cx="760" cy="402" r="22" fill="#fff" stroke="#c65370" stroke-width="2"/>

  <!-- Center node -->
  <circle cx="900" cy="315" r="44" fill="#fff" stroke="#1d1d1f" stroke-width="2.5"/>

  <!-- Text content (left side) -->
  <text x="100" y="240" class="name">Alvin Giovanni</text>
  <text x="100" y="300" class="role">Growth &amp; Product Analytics</text>
  <text x="102" y="530" class="url">alvingiovanni.github.io</text>

  <!-- Divider line -->
  <rect x="100" y="340" width="48" height="3" rx="1.5" fill="#3867d6"/>

  <!-- Descriptor pills -->
  <rect x="100" y="370" width="140" height="38" rx="19" fill="#3867d6" fill-opacity="0.1"/>
  <text x="170" y="394" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#3867d6">Analytics</text>

  <rect x="254" y="370" width="154" height="38" rx="19" fill="#7655c5" fill-opacity="0.1"/>
  <text x="331" y="394" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#7655c5">Data Science</text>

  <rect x="422" y="370" width="108" height="38" rx="19" fill="#27866e" fill-opacity="0.1"/>
  <text x="476" y="394" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#27866e">Strategy</text>

  <rect x="100" y="422" width="132" height="38" rx="19" fill="#bd7623" fill-opacity="0.1"/>
  <text x="166" y="446" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#bd7623">Python · SQL</text>

  <rect x="246" y="422" width="110" height="38" rx="19" fill="#c65370" fill-opacity="0.1"/>
  <text x="301" y="446" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#c65370">5+ Years</text>

  <!-- Right fade gradient so graph blends -->
  <defs>
    <linearGradient id="fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7f7f5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f7f7f5" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7f7f5" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f7f7f5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f7f7f5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="580" y="0" width="240" height="630" fill="url(#fade-left)"/>
</svg>
