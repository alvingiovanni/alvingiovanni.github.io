<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta property="og:description" content="An explorable map of five years of growth and product analytics work across fintech, e-commerce, and edtech." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- The whole site: one canvas you pan and zoom. -->
  <canvas id="canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="#/home">Alvin Giovanni<span>.</span></a>

    <div class="topbar-tools">
      <div class="search-wrap">
        <input
          id="search"
          type="search"
          placeholder="Search the map…"
          aria-label="Search nodes"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <button id="text-toggle" type="button" class="btn btn-ghost">Read as text</button>
      <a class="btn" href="assets/resume.pdf" target="_blank" rel="noopener">Resume</a>
    </div>
  </header>

  <div class="controls" role="group" aria-label="Canvas controls">
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-reset" type="button" class="wide">Reset view</button>
  </div>

  <p class="hint" id="hint">Drag to explore · scroll to zoom · click a circle to read</p>

  <p class="loading" id="loading">Loading the map…</p>

  <!-- Real links to every node: keyboard navigation, screen readers, crawlers. -->
  <nav class="sr-only" id="sr-nav" aria-label="All sections"></nav>

  <div class="warnings" id="warnings" role="status" hidden></div>

  <!-- Node detail. Backdrop is translucent so the canvas stays visible behind it. -->
  <div class="backdrop" id="backdrop" data-open="false" hidden>
    <article class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="Close">×</button>
      <div class="modal-body" id="modal-body" tabindex="-1"></div>
    </article>
  </div>

  <!-- Linear reading view: the whole site as one document. -->
  <div class="text-view" id="text-view" data-open="false" hidden>
    <div class="text-view-inner">
      <button class="modal-close" id="text-view-close" type="button" aria-label="Close text view">×</button>
      <h1>Alvin Giovanni — everything, in order</h1>
      <p class="text-view-lede">The same content as the map, laid out as one page.</p>
      <div id="text-view-body"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      <h1>Alvin Giovanni</h1>
      <p><strong>Growth &amp; Product Analytics · Data Strategy</strong></p>
      <p>I turn messy behavioral data into growth decisions people actually act on. 5+ years
      partnering with executives across fintech, e-commerce, and edtech — building segmentation
      models, propensity scores, and attribution frameworks that move real business metrics,
      not just dashboards.</p>
      <p>This site is an interactive map and needs JavaScript. In the meantime:
      <a href="assets/resume.pdf">my resume (PDF)</a> ·
      <a href="https://www.linkedin.com/in/alvingiovanni/">LinkedIn</a> ·
      <a href="mailto:alvingiovanni@outlook.com">alvingiovanni@outlook.com</a></p>
    </div>
  </noscript>

  <script src="js/markdown.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
