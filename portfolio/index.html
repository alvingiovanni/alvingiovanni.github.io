<!doctype html>
<!--
  Redirect stub for the site's old project-pages URL.

  This site used to live at alvingiovanni.github.io/portfolio/ (repo name: "portfolio").
  Renaming the repo to alvingiovanni.github.io moved it to the root URL, and GitHub does
  NOT redirect the old /portfolio/ path. This file keeps previously shared links working.

  Safe to delete once the old URL is no longer in circulation.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to alvingiovanni.github.io</title>
    <link rel="canonical" href="https://alvingiovanni.github.io/" />
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      // Preserve the node hash (e.g. /portfolio/#/segmentation) across the redirect.
      location.replace("/" + location.hash);
    </script>
  </head>
  <body>
    <p>This portfolio has moved to <a href="https://alvingiovanni.github.io/">alvingiovanni.github.io</a>.</p>
  </body>
</html>
