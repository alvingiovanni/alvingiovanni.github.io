<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Alvin Giovanni</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1d1d1f;
      --text-muted: #68686f;
      --accent: #3867d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --text: #f5f5f7;
        --text-muted: #a1a1a6;
        --accent: #4d7fe8;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      text-align: center;
      gap: 16px;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .icon {
      width: 52px;
      height: 52px;
      opacity: 0.25;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .countdown {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="currentColor" stroke-width="2" fill="none">
      <path d="M16 16 L16 6 M16 16 L26 21 M16 16 L6 21"/>
    </g>
    <g fill="currentColor">
      <circle cx="16" cy="6" r="3.5"/>
      <circle cx="26" cy="21" r="3.5"/>
      <circle cx="6" cy="21" r="3.5"/>
    </g>
    <circle cx="16" cy="16" r="4.5" fill="var(--bg)" stroke="currentColor" stroke-width="2.5"/>
  </svg>
  <h1>Page not found</h1>
  <p>This node doesn't exist on the graph. Heading back to the portfolio in <span id="n">3</span>s.</p>
  <a href="/">Back to the graph</a>
  <p class="countdown" aria-live="polite"></p>
  <script>
    var t = 3;
    var el = document.getElementById("n");
    var timer = setInterval(function () {
      t--;
      if (el) el.textContent = t;
      if (t <= 0) {
        clearInterval(timer);
        window.location.replace("/");
      }
    }, 1000);
  </script>
</body>
</html>
